# Instalar en /etc/postgresql/18/main/conf.d/cartera-rendimiento.conf
# Servidor: 1 vCPU, 2 GB RAM, disco SSD de DigitalOcean, bases < 100 MB.
# shared_buffers requiere reiniciar PostgreSQL; el resto aplica con reload.
shared_buffers = 256MB
effective_cache_size = 1GB
random_page_cost = 1.1
maintenance_work_mem = 128MB
