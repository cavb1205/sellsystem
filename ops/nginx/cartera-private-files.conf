# Instalar en /etc/nginx/snippets/cartera-private-files.conf
# Incluir dentro de cada bloque server antes de otros location con regex.
# Conserva el acceso de Certbot a /.well-known/acme-challenge/.
# Las solicitudes a archivos ocultos (.env, .git, ...) nunca son legítimas:
# quedan en api-bloqueado.log para que fail2ban (cartera-api-escaneo) las cuente.
location ~* (^|/)\.(?!well-known(?:/|$)) {
    access_log /var/log/nginx/api-bloqueado.log cartera;
    return 404;
}
