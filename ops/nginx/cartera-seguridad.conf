# Contexto http. Instalar en /etc/nginx/conf.d/cartera-seguridad.conf.
server_tokens off;

# Formato combined + host y tiempos (segundos) para detectar solicitudes lentas.
log_format cartera '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'host=$host rt=$request_time urt=$upstream_response_time';

# /admin/ de Django: pocos intentos por IP (además de la autenticación básica).
limit_req_zone $binary_remote_addr zone=cartera_admin:1m rate=10r/m;
