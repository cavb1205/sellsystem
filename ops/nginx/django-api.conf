# Instalar en /etc/nginx/sites-available/django-api (enlazado en sites-enabled).
# Las líneas "managed by Certbot" deben conservarse tal cual.
#
# Solo se envían a Django los prefijos que existen en sell_system/urls.py
# (Recaudos/test_nginx_allowlist.py lo verifica). Todo lo demás lo responde
# nginx con 404 y queda en api-bloqueado.log, que vigila fail2ban.
server {
    set_real_ip_from 137.184.176.199;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    include /etc/nginx/snippets/cartera-private-files.conf;

    server_name api.carterafinanciera.com;
    access_log /var/log/nginx/access.log cartera;

    include /etc/nginx/snippets/telegram-clientes-location.conf;

    location ~ ^/(tiendas|trabajadores|clientes|aportes|gastos|utilidades|ventas|recaudos|publicidad|token|login|register)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Panel de Django: autenticación básica de nginx + límite de intentos.
    location ^~ /admin/ {
        auth_basic "Restringido";
        auth_basic_user_file /etc/nginx/cartera-admin.htpasswd;
        limit_req zone=cartera_admin burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
    }

    location ^~ /static/ {
        alias /var/www/html/django-static/;
    }

    location / {
        access_log /var/log/nginx/api-bloqueado.log cartera;
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.carterafinanciera.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.carterafinanciera.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    set_real_ip_from 137.184.176.199;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    include /etc/nginx/snippets/cartera-private-files.conf;

    if ($host = api.carterafinanciera.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name api.carterafinanciera.com;
    listen 80;
    return 404; # managed by Certbot
}
